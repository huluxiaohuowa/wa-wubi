name: WAWubiMobile
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1.0.1"
targets:
  WubiCore:
    type: library.static
    platform: iOS
    sources: Sources/Core
    settings:
      base:
        DEFINES_MODULE: YES
  WAWubiMobile:
    type: application
    platform: iOS
    sources:
      - path: Mobile/App
        excludes: [OfflineCatalog.json, Info.plist, App.entitlements, PrivacyInfo.xcprivacy]
      - path: Mobile/App/OfflineCatalog.json
        buildPhase: resources
      - path: Mobile/App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Mobile/Shared
      - path: Resources/LGPL-3.0.txt
        buildPhase: resources
      - path: Resources/GPL-3.0.txt
        buildPhase: resources
      - path: Resources/Unicode-CLDR-LICENSE.txt
        buildPhase: resources
      - path: Mobile/Resources
        buildPhase: resources
    dependencies:
      - target: WubiCore
      - target: WAWubiKeyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.fuluwa.inputmethod.Wubi86.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Mobile/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mobile/App/App.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(WA_WUBI_APP_PROFILE)
  WAWubiKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Mobile/Keyboard
        excludes: [Info.plist, Keyboard.entitlements, PrivacyInfo.xcprivacy]
      - path: Mobile/Keyboard/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Mobile/Shared
      - path: Resources/LGPL-3.0.txt
        buildPhase: resources
      - path: Resources/GPL-3.0.txt
        buildPhase: resources
      - path: Resources/Unicode-CLDR-LICENSE.txt
        buildPhase: resources
      - path: Mobile/Resources
        buildPhase: resources
    dependencies:
      - target: WubiCore
    postBuildScripts:
      - name: Compile keyboard dictionary
        inputFiles:
          - $(SRCROOT)/Resources/wubi86.dict.yaml
          - $(SRCROOT)/Sources/Core/Lexicon.swift
          - $(SRCROOT)/Sources/Core/LexiconDatabase.swift
          - $(SRCROOT)/script/compile_mobile_lexicon.swift
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/wubi86.sqlite
        script: |
          set -eu
          compiler="$DERIVED_FILE_DIR/compile-mobile-lexicon"
          mkdir -p "$DERIVED_FILE_DIR" "$(dirname "$SCRIPT_OUTPUT_FILE_0")"
          xcrun --sdk macosx swiftc -O -target "$(uname -m)-apple-macosx13.0" \
              "$SCRIPT_INPUT_FILE_1" "$SCRIPT_INPUT_FILE_2" "$SCRIPT_INPUT_FILE_3" -o "$compiler"
          "$compiler" "$SCRIPT_INPUT_FILE_0" "$SCRIPT_OUTPUT_FILE_0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.fuluwa.inputmethod.Wubi86.ios.keyboard
        INFOPLIST_FILE: Mobile/Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mobile/Keyboard/Keyboard.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(WA_WUBI_KEYBOARD_PROFILE)
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  WAWubiMobile:
    build:
      targets:
        WAWubiMobile: all
