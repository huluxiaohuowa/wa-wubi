name: WAWubiMobile
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targetTemplates:
  candidateFont:
    postBuildScripts:
      - name: Bundle candidate font
        inputFiles:
          - $(SRCROOT)/Resources/WAWubiHan.zip
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/WAWubiHan.ttc
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ScriptwideSansCJK-OFL.txt
        script: |
          set -eu
          /usr/bin/unzip -p "$SCRIPT_INPUT_FILE_0" WAWubiHan.ttc > "$SCRIPT_OUTPUT_FILE_0"
          /usr/bin/unzip -p "$SCRIPT_INPUT_FILE_0" ScriptwideSansCJK-OFL.txt > "$SCRIPT_OUTPUT_FILE_1"
targets:
  WubiCore:
    type: library.static
    platform: iOS
    sources: Sources/Core
    settings:
      base:
        DEFINES_MODULE: YES
  WAWubiMobile:
    type: application
    templates: [candidateFont]
    platform: iOS
    sources:
      - path: Mobile/App
        excludes: [OfflineCatalog.json, Info.plist, App.entitlements]
      - path: Mobile/App/OfflineCatalog.json
        buildPhase: resources
      - Mobile/Shared
      - Sources/Mac/CandidateFont.swift
      - path: Resources/wubi86.dict.yaml
        buildPhase: resources
      - path: Mobile/Resources
        buildPhase: resources
    dependencies:
      - target: WubiCore
      - target: WAWubiKeyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.fuluwa.inputmethod.Wubi86.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Mobile/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mobile/App/App.entitlements
  WAWubiKeyboard:
    type: app-extension
    templates: [candidateFont]
    platform: iOS
    sources:
      - path: Mobile/Keyboard
        excludes: [Info.plist, Keyboard.entitlements]
      - Mobile/Shared
      - Sources/Mac/CandidateFont.swift
      - path: Resources/wubi86.dict.yaml
        buildPhase: resources
      - path: Mobile/Resources
        buildPhase: resources
    dependencies:
      - target: WubiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.fuluwa.inputmethod.Wubi86.ios.keyboard
        INFOPLIST_FILE: Mobile/Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mobile/Keyboard/Keyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  WAWubiMobile:
    build:
      targets:
        WAWubiMobile: all
